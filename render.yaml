# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Customer Data Merge - Render Workflows Demo
#
# This Blueprint deploys the frontend and API services.
# Workflows must be created manually in the Render Dashboard
# (see README.md for instructions).

projects:
  - name: customer-data-merge
    environments:
      - name: production
        services:
          # Frontend - Next.js static site
          - type: web
            name: customer-merge-frontend
            runtime: static
            rootDir: frontend
            buildCommand: npm ci && npm run build
            staticPublishPath: out
            envVars:
              - key: NEXT_PUBLIC_API_URL
                # Set this to the API's public https://*.onrender.com URL.
                # Render's fromService.host value is private-network-only and
                # cannot be called by a user's browser.
                sync: false

          # TypeScript API - Fastify service
          - type: web
            name: customer-merge-api-typescript
            runtime: node
            plan: free
            rootDir: typescript/api
            buildCommand: npm ci && npm run build
            startCommand: npm start
            healthCheckPath: /health
            envVars:
              - key: RENDER_API_KEY
                sync: false
              - key: WORKFLOW_SLUG
                # Set this to the generated Workflow Slug shown by
                # `render workflows list` (it can include a suffix).
                sync: false
              - key: DEMO_MODE
                value: "true"
              - key: FRONTEND_ORIGIN
                sync: false
